.qt-login-art>*{position:relative;z-index:2}.qt-login-cloud,.qt-login-village{display:none!important}.qt-login-logo{width:66px!important;height:66px!important;border-radius:50%!important;background:var(--q-red)!important;display:grid!important;place-items:center!important;font-size:31px!important}
.qt-login-art h1{font-size:28px!important;margin:10px 0 0!important}.qt-login-art h2{font-size:21px!important;margin:2px 0!important}.qt-login-art p{margin:4px 0 0!important}
.qt-login-form{background:#fff!important;border-radius:22px 22px 0 0!important;margin-top:-18px!important;position:relative!important;padding:24px 20px 30px!important}
.qt-login-input{border:1px solid #e6e8eb!important;border-radius:12px!important;background:#fff!important}.qt-login-form .qt-shop-btn-primary{height:50px!important;font-size:16px!important}
.qt-ref-order{border-radius:16px!important}.qt-ref-order-id b{background:var(--q-red)!important;color:#fff!important;border-radius:8px!important;padding:7px 10px!important}
.qt-shop-status{border-radius:999px!important}
.qt-ref-grand{color:var(--q-red)!important}.qt-ref-person a,.qt-chat-open{color:var(--q-red)!important}
.qgo-cover{height:132px;border-radius:16px;overflow:hidden;position:relative;margin-bottom:14px;background:#eee}.qgo-cover img{width:100%;height:100%;object-fit:cover}.qgo-cover .qgo-cam{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;border:1px solid var(--q-line)}
.qgo-store-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.qgo-store-head h2{font-size:20px;margin:0}.qgo-online{font-size:11px;color:var(--q-green);background:#eaf9f2;padding:5px 8px;border-radius:999px}
.qgo-info-row{padding:11px 0;border-bottom:1px solid var(--q-line);font-size:13px}.qgo-info-row:last-child{border-bottom:0}
.qgo-addbar{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;width:min(488px,calc(100% - 32px));z-index:55}.qgo-addbar button{width:100%;height:48px;border:0;border-radius:15px;background:var(--q-red);color:#fff;font-weight:800;font-size:15px}
.qgo-cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.qgo-cat{border:1px solid var(--q-line);background:#fff;border-radius:15px;padding:14px 7px;text-align:center;font-size:11px}.qgo-cat span{display:block;font-size:25px;margin-bottom:6px}
.qgo-popular{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.qgo-popular .card{background:#fff;border:1px solid var(--q-line);border-radius:14px;padding:8px}.qgo-popular img{width:100%;aspect-ratio:1/1;border-radius:10px;object-fit:cover}.qgo-popular b{display:block;font-size:11px;margin:6px 0 2px}.qgo-popular small{font-size:10px;color:var(--q-muted)}.qgo-popular button{width:100%;border:0;border-radius:999px;background:var(--q-red);color:#fff;padding:6px;margin-top:6px}
@media(min-width:700px){body.qt-shop-app .qt-main{max-width:560px!important}.qt-login-screen{max-width:430px;margin:auto;box-shadow:0 0 30px rgba(0,0,0,.08)}}

   const item=(href,icon,label,key)=>`<a href="#${href}" class="${active===key?'active':''}"><span class="bi">${icon}${key==='orders'&&pending?`<span class="qt-shop-badge">${pending}</span>`:''}</span>${label}</a>`;
   return `<nav class="qt-shop-bottom">${item('dashboard','⌂','หน้าหลัก','home')}${item('shop-orders','▣','คำสั่งซื้อ','orders')}${item('shop-products','▤','สินค้า','products')}${item('shop-promote','◇','โปรโมชั่น','promote')}${item('shop-profile','♙','บัญชี','profile')}</nav>`;
 };
 const oldLayout=window.qtShopLayout;
 window.qtShopLayout=function(title,content,active){
   document.title=title+' - QueueGo Shop';
   document.body.classList.remove('qt-shop-login','qt-support-page','qt-admin-support-page');document.body.classList.add('qt-shop-app');
   const u=shopUser();document.querySelectorAll('body > .qt-shop-bottom').forEach(n=>n.remove());
   document.getElementById('app').innerHTML=`<header class="qt-header"><div class="qt-shop-brand"><div class="qt-shop-brand-mark">🛒</div><div class="qt-shop-brand-name">QueueGo</div></div>${u?`<button class="qt-shop-icon-btn" onclick="navigate('notifications')">♢</button>`:''}</header><main class="qt-main">${content}</main>${u?window.shopNav(active):''}<div id="notif-toast-box"></div>`;
   const nav=document.querySelector('#app > .qt-shop-bottom');if(nav)document.body.appendChild(nav);
 };
 window.shopLayout=window.qtShopLayout;

 window.renderShopLogin=function(){
   document.querySelectorAll('body > .qt-shop-bottom').forEach(n=>n.remove());document.body.className='qt-shop-login';
   document.getElementById('app').innerHTML=`<main class="qt-login-screen"><div class="qt-login-art"><div class="qt-login-logo">🛒</div><h1>QueueGo</h1><h2>เข้าสู่ระบบร้านค้า</h2><p>จัดการร้านของคุณได้ง่ายบนแอป QueueGo</p></div><section class="qt-login-form"><form onsubmit="return qtShopDoLogin(event)"><label class="qt-login-input"><span>☎</span><input required id="qt-shop-login" autocomplete="username" placeholder="เบอร์โทรศัพท์ / อีเมล"></label><label class="qt-login-input"><span>♙</span><input required type="password" id="qt-shop-password" autocomplete="current-password" placeholder="รหัสผ่าน"></label><button class="qt-shop-btn qt-shop-btn-primary" type="submit">เข้าสู่ระบบ</button></form><button class="qt-login-link" onclick="qtShopForgotPassword()">ลืมรหัสผ่าน?</button><button class="qt-shop-btn qt-shop-btn-danger" onclick="navigate('shop-register')">สมัครร้านค้าใหม่</button></section></main>`;
 };

 window.renderShopDashboardModern=function(u){
   const orders=shopOrders(u),today=qtLocalDateKey(),todayOrders=orders.filter(o=>(o.orderDate||qtLocalDateKey(o.createdAt))===today);
   const counts={all:todayOrders.length,prep:todayOrders.filter(o=>['shop_accepted','preparing'].includes(o.status)).length,done:todayOrders.filter(o=>['completed','delivered'].includes(o.status)).length,cancel:todayOrders.filter(o=>o.status==='cancelled').length};
   const cover=qtShopImageSrc(u.cover||u.logo),logo=qtShopImageSrc(u.logo);
   window.qtShopLayout('หน้าหลัก',`<div class="qt-dashboard-shop"><img src="${escapeHtml(logo)}"><div><b>${escapeHtml(u.shopName||u.name||'ร้านค้าของคุณ')}</b><small>● ${u.acceptingOrders!==false?'ออนไลน์':'ออฟไลน์'}</small><small>${escapeHtml(categoryLabel(u.category)||'ร้านค้า')}</small></div></div><div class="qgo-cover"><img src="${escapeHtml(cover)}"></div><h3 class="qt-section-heading">สรุปยอดวันนี้</h3><div class="qt-dashboard-status">${[['ออเดอร์ทั้งหมด',counts.all],['กำลังเตรียม',counts.prep],['จัดส่งแล้ว',counts.done],['ยกเลิก',counts.cancel]].map(([t,v])=>`<div><small>${t}</small><b>${v}</b></div>`).join('')}</div><h3 class="qt-section-heading">เมนูหลัก</h3><div class="qt-dashboard-shortcuts">${[['▣','จัดการคำสั่งซื้อ','shop-orders'],['▤','จัดการสินค้า','shop-products'],['★','โปรโมชั่น','shop-promote'],['▥','รายงาน','shop-settlement'],['▣','ข้อมูลร้านค้า','shop-profile'],['⚙','ตั้งค่า','shop-modules']].map(([i,t,r])=>`<button onclick="navigate('${r}')"><span>${i}</span><small>${t}</small></button>`).join('')}</div>`,'home');
 };

 window.renderShopProfileModern=function(){
   const u=shopUser();if(!u){navigate('login');return}
   const cover=qtShopImageSrc(u.cover||u.logo);
   window.qtShopLayout('ข้อมูลร้านค้า',`<div class="qt-shop-page-title"><h2>ข้อมูลร้านค้า</h2></div><div class="qgo-cover"><img src="${escapeHtml(cover)}"><button class="qgo-cam" onclick="navigate('shop-setup')">⌑</button></div><div class="qgo-store-head"><h2>${escapeHtml(u.shopName||u.name||'ร้านค้า')}</h2><span class="qgo-online">● ออนไลน์</span></div><div class="qt-shop-card" style="padding:4px 14px"><div class="qgo-info-row">▣ ${escapeHtml(categoryLabel(u.category)||'ร้านค้า')}</div><div class="qgo-info-row">☎ ${escapeHtml(u.phone||'-')}</div><div class="qgo-info-row">⌖ ${escapeHtml(u.address||'-')}</div><div class="qgo-info-row">◷ เปิดบริการ ${escapeHtml(u.openTime||'06:00')} - ${escapeHtml(u.closeTime||'22:00')} น.</div></div><button class="qt-shop-btn qt-shop-btn-danger" onclick="navigate('shop-setup')">✎ แก้ไขข้อมูลร้าน</button><button class="qt-shop-btn qt-shop-btn-primary" onclick="navigate('shop-products')">▤ จัดการเมนูสินค้า</button><button class="qt-shop-btn qt-shop-btn-danger" onclick="logout()">ออกจากระบบ</button>`,'profile');
 };

 window.renderShopProductsModern=function(){
   const u=shopUser();if(!u){navigate('login');return}const ps=shopProducts(u);
   window.qtShopLayout('จัดการสินค้า',`<div class="qt-shop-page-title"><h2>จัดการสินค้า</h2></div><div class="qt-ref-search">⌕ <input placeholder="ค้นหาสินค้า..." oninput="qtShopProductQuery(this.value)"></div><div class="qt-ref-tabs"><button class="active">ทั้งหมด</button><button onclick="qtShopProductQuery('เปิดขาย')">เปิดขาย</button><button onclick="qtShopProductQuery('ปิดขาย')">ปิดขาย</button></div>${ps.length?ps.map(p=>`<div class="qt-ref-product" data-search="${escapeHtml((p.name+' '+(p.category||'')+' '+(p.available!==false?'เปิดขาย':'ปิดขาย')).toLocaleLowerCase())}"><img src="${escapeHtml(qtShopImageSrc(p.image))}"><div><b>${escapeHtml(p.name)}</b><strong>${Number(p.price||0).toLocaleString('th-TH')} บาท</strong></div><label class="qt-ref-toggle"><input type="checkbox" ${p.available!==false?'checked':''} onchange="qtShopSetAvailable('${p.id}',this.checked)"><span></span></label></div>`).join(''):'<div class="qt-shop-empty">ยังไม่มีสินค้า</div>'}<div class="qgo-addbar"><button onclick="navigate('shop-catalog')">＋ เพิ่มสินค้า</button></div>`,'products');
 };

 window.renderShopCatalog=function(){
   const u=shopUser(),ps=shopProducts(u),sample=ps.slice(0,3);
   const cats=[['🥤','เครื่องดื่ม'],['🍜','บะหมี่กึ่งสำเร็จรูป'],['🍚','ข้าวสาร'],['🥫','อาหารกระป๋อง'],['🍞','ขนมอบ'],['🏠','ของใช้ในบ้าน'],['🧴','ของใช้ส่วนตัว'],['🧂','เครื่องปรุง'],['❄️','แช่เย็น/แช่แข็ง'],['•••','อื่นๆ']];
   window.qtShopLayout('เพิ่มสินค้าจากคลัง',`<div class="qt-shop-page-title"><button class="qt-shop-back" onclick="navigate('shop-products')">←</button><h2>เพิ่มสินค้าจากคลังสินค้า</h2></div><div class="qt-ref-search">⌕ <input placeholder="ค้นหาสินค้าในคลัง..."></div><div class="qgo-cat-grid">${cats.map(c=>`<button class="qgo-cat" onclick="toast('เลือกหมวด ${c[1]}')"><span>${c[0]}</span>${c[1]}</button>`).join('')}</div><h3 class="qt-section-heading">สินค้ายอดนิยม</h3><div class="qgo-popular">${sample.length?sample.map(p=>`<div class="card"><img src="${escapeHtml(qtShopImageSrc(p.image))}"><b>${escapeHtml(p.name)}</b><small>${Number(p.price||0).toLocaleString('th-TH')} บาท</small><button onclick="openProductForm('${p.id}');navigate('shop-products')">เพิ่ม</button></div>`).join(''):`<div class="qt-shop-empty" style="grid-column:1/-1">ยังไม่มีสินค้าในคลัง</div>`}</div><button class="qt-shop-btn qt-shop-btn-primary" onclick="navigate('shop-products');setTimeout(()=>openProductForm(),50)">＋ เพิ่มสินค้าใหม่เข้าร้าน</button>`,'products');
 };

 const oldRoute=window.qtShopRoute;
 window.qtShopRoute=function(){
   const hash=location.hash.replace('#','')||'home',[page,param]=hash.split('/'),u=currentUser();
   if(page==='login'||!u){if(page==='shop-register'){renderShopRegister();return}renderShopLogin();return}
   if(u.type==='admin'){renderAdminSupport();return}
   if(u.type!=='shop'){renderShopLogin();return}
   if(u.status!=='approved'&&!['approval-pending','shop-setup'].includes(page)){renderShopPending();return}
   if(page==='shop-catalog'){window.renderShopCatalog();window.scrollTo(0,0);return}
   oldRoute();
 };
 window.router=function(){try{window.qtShopRoute()}catch(err){console.error(err);try{toast('แสดงหน้านี้ไม่สำเร็จ')}catch(e){}}};
})();
</script>

</body>
</html>
