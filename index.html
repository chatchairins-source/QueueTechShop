<script id="qt-v532-helpers">
/* V5.32 helpers — defined first so every later script can use them */
function escapeHtml(value){ return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }
function qtCleanText(v){ return String(v==null?'':v).replace(/[<>]/g,'').replace(/\s+/g,' ').trim(); }

/* Sync state: in-flight writes, per-row "last persisted" hashes, polling bookkeeping */
const QT_SYNC={pending:0,lastWrite:0,busy:false,dirty:{},hash:{},profileMaps:null,tick:0,lastErrorToast:0,timer:null};
function qtTrackPersist(p){
  QT_SYNC.pending++; QT_SYNC.lastWrite=Date.now();
  return Promise.resolve(p).finally(()=>{ QT_SYNC.pending=Math.max(0,QT_SYNC.pending-1); QT_SYNC.lastWrite=Date.now(); });
}
function qtSyncFailed(key,err){
  console.warn('Supabase sync failed:',key,err);
  /* Notifications are auxiliary. A notification RLS failure must never make an
     order, cancellation, assignment, payment, or other business action look
     like it failed. The notification remains in the current session and will
     be retried by the normal sync cycle after the DB policy is corrected. */
  if(key==='qt_notifications'){ console.warn('QueueTech notification sync failed; auth/session may need refresh.', {hasSession:!!qtSessionRead(), hasAccessToken:!!qtAccessToken(), hasRefreshToken:!!qtSessionRead()?.refreshToken}); return; }
  if(Date.now()-QT_SYNC.lastErrorToast<15000) return;
  QT_SYNC.lastErrorToast=Date.now();
  try{ toast('บันทึกข้อมูลขึ้นเซิร์ฟเวอร์ไม่สำเร็จ ('+String((err&&err.message)||'unknown').slice(0,80)+')'); }catch(e){}
}
/* notifications: in-app objects use {body, link}; the table has {message, type, reference_id} */
function qtNotifDbParts(n){
  const m=String(n.link||'').match(/^(?:shop-order|order)\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i);
  if(m) return {type:'order',ref:m[1]};
  return {type:['order','quotation','delivery','payment','complaint','system'].includes(n.type)?n.type:'system',ref:(n.referenceId&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(n.referenceId))?n.referenceId:null};
}
function qtNotifLinkFromRow(n){ if(!n.reference_id) return undefined; if(n.type==='order') return 'shop-order/'+n.reference_id; return undefined; }
/* never send the password (or other secrets) to the database inside metadata */
function qtUserMetadata(u){
  const m=Object.assign({},u);
  delete m.password;
  delete m.status;
  delete m.applicationStatus;
  delete m.authUserId;
  delete m.type;
  delete m.id;
  /* Shop modules have their own database table; never duplicate them in users.metadata. */
  delete m.modules;
  return m;
}

<script id="qt-supabase-client">
/* QueueTech Supabase connection — public publishable key only */
window.QT_SUPABASE_CONFIG = {
  URL: 'https://pkypiqhlrmzocysgeqew.supabase.co',
  KEY: 'sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre'
};
function qtSupabaseHeaders(accessToken){
  const h={apikey:QT_SUPABASE_CONFIG.KEY,'Content-Type':'application/json'};
  if(accessToken) h.Authorization='Bearer '+accessToken;
  return h;
}
async function qtSupabaseAuth(path, body){
  const r=await fetch(QT_SUPABASE_CONFIG.URL+'/auth/v1/'+path,{method:'POST',headers:qtSupabaseHeaders(),body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error_description||data.msg||data.message||'AUTH_ERROR');
  return data;
}

async function qtSupabaseTable(path, options={}){
  const headers=qtSupabaseHeaders(options.accessToken);
  const isNotif=String(path).startsWith('notifications');
  const rep=isNotif ? 'return=minimal' : 'return=representation';
  if(['POST','PATCH','PUT'].includes(String(options.method||'GET').toUpperCase())){
    headers.Prefer=String(path).includes('on_conflict=') && String(options.method||'').toUpperCase()==='POST'
      ? rep+',resolution=merge-duplicates' : rep;
  }
  const r=await fetch(QT_SUPABASE_CONFIG.URL+'/rest/v1/'+path,{method:options.method||'GET',headers,body:options.body?JSON.stringify(options.body):undefined});
  const data=await r.json().catch(()=>null);
  if(!r.ok) throw new Error((data&&data.message)||((data&&data.hint)?data.hint:'DB_ERROR_'+r.status));
  return data;
}
function qtAuthEmailFromPhone(phone){
  const digits=String(phone||'').replace(/\D/g,'');
  return digits+'@auth.queuetech.local';
}
async function qtCreateSupabaseUser({type,name,phone,password,email}){
  const cleanEmail=String(email||'').trim().toLowerCase();
  const cleanPhone=String(phone||'').trim();
  const authEmail=cleanEmail || qtAuthEmailFromPhone(cleanPhone);
  const auth=await qtSupabaseAuth('signup',{
    email:authEmail,
    password,
    data:{name,phone:cleanPhone||null,role:'shop'}
  });
  let session=auth.session;
  if(!auth.user) throw new Error('สร้างบัญชี Auth ไม่สำเร็จ');
  if(!session || !session.access_token){
    if(cleanEmail){
      return {auth,session:null,profile:null,needsEmailConfirmation:true,authEmail};
    }
    try{
      session=await qtSupabaseAuth('token?grant_type=password',{email:authEmail,password});
    }catch(loginErr){
      throw new Error('AUTH_CONFIRMATION_REQUIRED');
    }
  }
  /* V5.37 FIX:
     The users table flow already uses auth_user_id as the conflict identity
     elsewhere in QueueTech. Use that same database-backed identity here.
     Do not use phone as the conflict target because the earlier V5.32 target
     was not backed by a matching UNIQUE/EXCLUSION constraint. */
  const row={
    auth_user_id:auth.user.id,
    role:'shop',
    name,
    phone:cleanPhone||null,
    status:'pending'
  };
  const rows=await qtSupabaseTable('users?select=id,auth_user_id,role,name,phone,status,created_at&on_conflict=auth_user_id',{method:'POST',accessToken:session.access_token,body:row});
  const profile=Array.isArray(rows)?rows[0]:rows;
  if(!profile) throw new Error('สร้างข้อมูลผู้ใช้ในฐานข้อมูลไม่สำเร็จ');
  return {auth,session,profile,needsEmailConfirmation:false,authEmail};
}
async function qtLoadOwnSupabaseUser(accessToken, authUserId){
  const rows=await qtSupabaseTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(authUserId),{accessToken});
  return Array.isArray(rows)?rows[0]:null;
}
</script>
<script crossorigin="" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================================
   QueueTech V5.51 — Functional Prototype (Single File)
   Notification RLS resilience: notification sync failures are non-blocking.
   Based on V5.50 search-location build.
   ========================================================================= */
/* =========================================================================
   QueueTech V5.8 — Functional Prototype (Single File)
   Vanilla JS + Supabase + Leaflet/OSM
   ⚠️ Prototype เท่านั้น — ข้อมูลระบบบันทึกใน Supabase; Session ชั่วคราวเก็บใน sessionStorage
   ห้ามใช้ข้อมูลจริงหรือนำขึ้น Production โดยไม่ปรับปรุงระบบความปลอดภัยก่อน
   ========================================================================= */

/* ---------- Supabase-backed application data layer ----------
   Business data is kept in memory and persisted to Supabase.
   Business data is held in memory and synchronized with Supabase.
   sessionStorage is used only for the current browser session token. */
const QT_DB_CACHE = Object.create(null);
const QT_DB_KEYS = new Set(['qt_users','qt_orders','qt_notifications','qt_audit_log','qt_promotions','qt_products','qt_settlements']);
const QT_SHOP_MODULE_STATUSES = ['disabled','trial','enabled'];
const QT_DB_READY = {value:false};
function dbGet(key, def){
  if(Object.prototype.hasOwnProperty.call(QT_DB_CACHE,key)) return QT_DB_CACHE[key];
  return def!==undefined ? def : [];
}
function dbSet(key, val){
  QT_DB_CACHE[key]=val;
  if(QT_SYNC.busy) QT_SYNC.dirty[key]=val; /* a poll is in flight: re-apply this local write after it finishes */
  if(QT_DB_KEYS.has(key)) qtTrackPersist(qtPersistKey(key,val)).catch(err=>qtSyncFailed(key,err));
  else if(String(key).startsWith('qt_order_chat_') && !String(key).endsWith('_deleteAt')) qtTrackPersist(qtPersistChat(String(key).replace('qt_order_chat_',''),val)).catch(err=>qtSyncFailed(key,err));
  else if(!String(key).endsWith('_deleteAt')) console.warn('[QueueTech] dbSet("'+key+'") is not in QT_DB_KEYS and has no sync handler — this write stays local-only and will NOT sync to Supabase or other devices. Add "'+key+'" to QT_DB_KEYS in the code if this data should be shared.');
}

async function qtPersistChat(orderId,messages){
  const token=await qtGetAccessToken(); if(!token||!qtUuidLike(orderId)) return;
  const rows=Array.isArray(messages)?messages:[];
  for(const m of rows){ if(!qtUuidLike(m.id)||!qtUuidLike(m.senderId)) continue; await qtSupabaseTable('order_chat_messages?on_conflict=id',{method:'POST',accessToken:token,body:{id:m.id,order_id:orderId,sender_id:m.senderId,message:m.text||'',created_at:qtIso(m.createdAt)}}); }
}
function uid(){ return (window.crypto&&crypto.randomUUID) ? crypto.randomUUID() : ('00000000-0000-4000-8000-'+Math.random().toString(16).slice(2,14).padEnd(12,'0')); }

function qtSessionRead(){ try{return JSON.parse(sessionStorage.getItem('qt_session')||'null')}catch(e){return null} }
function qtSessionWrite(s){ try{sessionStorage.setItem('qt_session',JSON.stringify(s));}catch(e){} }
function qtSessionClear(){ try{sessionStorage.removeItem('qt_session');}catch(e){} }
function qtAccessToken(){ return qtSessionRead()?.accessToken || ''; }
function qtJwtExpiryMs(token){
  try{
    const part=String(token||'').split('.')[1];
    if(!part) return 0;
    const b64=part.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((part.length+3)%4);
    const payload=JSON.parse(atob(b64));
    return Number(payload.exp||0)*1000;
  }catch(e){ return 0; }
}
let QT_AUTH_REFRESH_PROMISE=null;
async function qtGetAccessToken(forceRefresh=false){
  const s=qtSessionRead();
  if(!s?.accessToken) return '';
  const exp=Number(s.expiresAt||0)||qtJwtExpiryMs(s.accessToken);
  const needsRefresh=forceRefresh || (exp>0 && exp-Date.now()<60000);
  if(!needsRefresh || !s.refreshToken) return s.accessToken;
  if(QT_AUTH_REFRESH_PROMISE) return QT_AUTH_REFRESH_PROMISE;
  QT_AUTH_REFRESH_PROMISE=(async()=>{
    try{
      const r=await fetch(QT_SUPABASE_CONFIG.URL+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',headers:qtSupabaseHeaders(),
        body:JSON.stringify({refresh_token:s.refreshToken})
      });
      const data=await r.json().catch(()=>({}));
      if(!r.ok || !data.access_token) throw new Error(data.error_description||data.msg||data.message||'SESSION_REFRESH_FAILED');
      const next={...s,accessToken:data.access_token,refreshToken:data.refresh_token||s.refreshToken,expiresAt:data.expires_at||Math.floor(qtJwtExpiryMs(data.access_token)/1000)||null};
      qtSessionWrite(next);
      return next.accessToken;
    }finally{ QT_AUTH_REFRESH_PROMISE=null; }
  })();
  return QT_AUTH_REFRESH_PROMISE;
}
function qtIso(ts){ return new Date(ts||Date.now()).toISOString(); }
function qtUuidLike(id){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(id||'')); }

function qtOrderStatusToDb(s){
  const m={pending_shop:'pending',shop_accepted:'accepted',preparing:'preparing',waiting_rider:'ready',rider_to_shop:'assigned',picked_up:'picked_up',delivering:'in_progress',arrived:'in_progress',delivered:'completed',completed:'completed',cancelled:'cancelled'};
  return m[s]||(['pending','accepted','preparing','ready','assigned','picked_up','in_progress','completed','cancelled'].includes(s)?s:'pending');
}
function qtOrderStatusFromDb(s, note=''){ const m=(note||'').match(/__QT_ORDER_STATUS__=([^\n]+)/)?.[1]; if(m) return m; const map={ready:'waiting_rider',assigned:'rider_to_shop',picked_up:'picked_up',in_progress:'delivering',completed:'completed'}; return map[s]||s; }


function qtUserToRow(u, includeStatus=true){
  const meta=qtUserMetadata(u);
  const row={id:qtUuidLike(u.id)?u.id:undefined,auth_user_id:u.authUserId||null,role:u.type,name:u.name||'',phone:u.phone||'',
    metadata:meta,created_at:qtIso(u.createdAt),updated_at:qtIso(Date.now())};
  /* the column is the source of truth: pending stays pending until an admin approves ('active') */
  if(includeStatus) row.status = u.status==='suspended' ? 'suspended'
    : u.status==='deleted' ? 'deleted'
    : (u.type==='admin'||u.status==='approved') ? 'active' : 'pending';
  return row;
}
function qtUserFromRow(r){
  const meta=(r.metadata&&typeof r.metadata==='object'&&!Array.isArray(r.metadata))?r.metadata:{};
  const u=Object.assign({createdAt:new Date(r.created_at).getTime(),supabase:true},meta);

  /*
   * V5.40 BATCH 2 — Account status comes ONLY from users.status.
   *
   * Before this fix, an old metadata.status='pending' or 'rejected' could
   * override a real users.status='active'. That could make an already
   * approved shop appear pending again after refresh/background hydrate.
   */
  let status;
  if(r.status==='suspended'||r.status==='deleted') status=r.status;
  else if(r.role==='admin') status='approved';
  else if(r.status==='active') status='approved';
  else status='pending';

  /* identity/role/status always come from real columns, never metadata */
  u.id=r.id;
  u.authUserId=r.auth_user_id;
  u.type=r.role;
  u.name=r.name;
  u.phone=r.phone;
  u.status=status;

  delete u.password;
  return u;
}

function qtOrderToRow(o){
  const pickup=o.pickup||{};
  const delivery=o.delivery||{};
  return {id:qtUuidLike(o.id)?o.id:undefined,order_number:String(o.orderNumber||o.orderNo||o.id||uid()),customer_id:o.customerId||null,shop_id:o.shopProfileId||null,technician_id:null,rider_id:o.riderProfileId||null,order_type:'shopping',status:qtOrderStatusToDb(o.status),subtotal:Number(o.subtotal||0),delivery_fee:Number(o.deliveryFee||0),total_amount:Number(o.total||o.totalAmount||0),pickup_address:o.pickupAddress??pickup.address??null,pickup_latitude:o.pickupLat??pickup.lat??null,pickup_longitude:o.pickupLng??pickup.lng??null,delivery_address:o.deliveryAddress??delivery.address??null,delivery_latitude:o.deliveryLat??delivery.lat??null,delivery_longitude:o.deliveryLng??delivery.lng??null,note:(`__QT_ORDER_STATUS__=${o.status}\n`+(o.cancelReason?`__QT_CANCEL_REASON__=${String(o.cancelReason).replace(/\n/g,' ')}\n`:'')+(o.note||'')).trim()||null,created_at:qtIso(o.createdAt),updated_at:qtIso(Date.now())};
}
function qtOrderFromRow(r){
  return {id:r.id,orderNumber:r.order_number,customerId:r.customer_id,shopProfileId:r.shop_id,riderProfileId:r.rider_id,status:qtOrderStatusFromDb(r.status,r.note),orderType:r.order_type,subtotal:Number(r.subtotal||0),deliveryFee:Number(r.delivery_fee||0),total:Number(r.total_amount||0),pickupAddress:r.pickup_address||'',pickupLat:r.pickup_latitude,pickupLng:r.pickup_longitude,deliveryAddress:r.delivery_address||'',deliveryLat:r.delivery_latitude,deliveryLng:r.delivery_longitude,note:r.note||'',cancelReason:(r.note||'').match(/__QT_CANCEL_REASON__=([^\n]+)/)?.[1]||'',createdAt:new Date(r.created_at).getTime(),updatedAt:new Date(r.updated_at||r.created_at).getTime(),items:[]};
}


const QT_HASHED_KEYS=new Set(['qt_users','qt_orders','qt_notifications','qt_products']);
function qtSafeJson(x){ try{ return JSON.stringify(x); }catch(e){ return null; } }
function qtMarkClean(key){
  const b=QT_SYNC.hash[key]={};
  (Array.isArray(QT_DB_CACHE[key])?QT_DB_CACHE[key]:[]).forEach(x=>{ if(x&&x.id){ const h=qtSafeJson(x); if(h!==null) b[x.id]=h; } });
}
/* Only rows that changed since they were loaded/saved are sent; non-admins can only write their own user row. */
async function qtPersistKey(key,val){
  const token=await qtGetAccessToken(); if(!token || !window.QT_SUPABASE_CONFIG) return;
  if(!QT_HASHED_KEYS.has(key) || !Array.isArray(val)) return qtPersistKeyRaw(key,val);
  const me=qtSessionRead()||{}; const bucket=QT_SYNC.hash[key]||(QT_SYNC.hash[key]={});
  const changed=[], marks=[];
  for(const x of val){
    if(!x||!x.id||x._profileOnly) continue;
    if(key==='qt_users' && me.role!=='admin' && x.id!==me.userId) continue;
    const h=qtSafeJson(x);
    if(h!==null && bucket[x.id]===h) continue;
    changed.push(x); if(h!==null) marks.push([x.id,h]);
  }
  if(!changed.length) return;
  await qtPersistKeyRaw(key,changed);
  marks.forEach(([id,h])=>{ bucket[id]=h; });
}
async function qtPersistKeyRaw(key,val){
  const token=qtAccessToken(); if(!token || !window.QT_SUPABASE_CONFIG) return;
  const isAdmin=(qtSessionRead()||{}).role==='admin';
  try{
    if(key==='qt_users'){
      for(const u of (val||[])){
        if(!qtUuidLike(u.id)) continue;
        await qtSupabaseTable('users?on_conflict=id',{method:'POST',accessToken:token,body:qtUserToRow(u,isAdmin)});
        if(u.type==='shop'){
          /* Shop coordinates live in shop_profiles. Never use a broad upsert here:
             stale qt_users cache must not overwrite a newer DB coordinate. Update the
             existing profile by its user_id and only send coordinate fields when the
             local profile actually has numeric coordinates. */
          const shopRows=await qtSupabaseTable('shop_profiles?select=id&user_id=eq.'+encodeURIComponent(u.id)+'&limit=1',{accessToken:token});
          const shopBody={shop_name:u.shopName||u.name||'ร้านค้า',phone:u.phone||null,address:u.address||null,status:u.status==='suspended'?'suspended':'active',metadata:qtUserMetadata(u)};
          if(Number.isFinite(Number(u.lat)) && Number.isFinite(Number(u.lng))){shopBody.latitude=Number(u.lat);shopBody.longitude=Number(u.lng);}
          if(Array.isArray(shopRows)&&shopRows[0]?.id){
            await qtSupabaseTable('shop_profiles?id=eq.'+encodeURIComponent(shopRows[0].id),{method:'PATCH',accessToken:token,body:shopBody});
          }else{
            await qtSupabaseTable('shop_profiles?on_conflict=user_id',{method:'POST',accessToken:token,body:{user_id:u.id,...shopBody}});
          }
        }
      } return;
    }
    if(key==='qt_orders'){
      const __pm=new Map(); const profileId=async(table,userId)=>{if(!qtUuidLike(userId))return null; const ck=table+':'+userId; if(__pm.has(ck)) return __pm.get(ck); const rows=await qtSupabaseTable(table+'?select=id&user_id=eq.'+encodeURIComponent(userId)+'&limit=1',{accessToken:token}); const v=Array.isArray(rows)&&rows[0]?rows[0].id:null; __pm.set(ck,v); return v;};
      for(const o of (val||[])){
        if(!qtUuidLike(o.id)) continue;
        const row=qtOrderToRow(o);

/* V5.33 performance: hydrate runs in the background — it must never block first paint or login.
   QT_DB_HYDRATING guards against overlapping loads (login + initial load + sync loop). */
let QT_DB_HYDRATING=false, QT_DB_HYDRATE_QUEUED=null, QT_DB_FULL_TRIED=false;
async function qtBackgroundHydrate(opts){
  opts=opts||{light:false};
  if(!qtAccessToken()){ QT_DB_READY.value=true; return; }
  if(QT_DB_HYDRATING){ /* already loading: remember one follow-up run instead of running two loads at once */
    if(!QT_DB_HYDRATE_QUEUED || !opts.light) QT_DB_HYDRATE_QUEUED=opts;
    return;
  }
  if(QT_SYNC.busy){ setTimeout(()=>qtBackgroundHydrate(opts),1000); return; } /* a sync poll is in flight; try again shortly */
  const token=await qtGetAccessToken();
  if(!token){ QT_DB_READY.value=true; return; }
  QT_DB_HYDRATING=true; QT_SYNC.busy=true; QT_SYNC.dirty={}; /* busy also pauses the sync loop and records local writes made meanwhile */
  let ok=false;
  try{
    await qtHydrateDatabase(opts);
    ok=true;
  }catch(err){
    console.error('Background hydrate failed:',err);
    try{ if(qtSessionRead()?.role==='admin') toast('โหลดข้อมูลสมาชิกจากฐานข้อมูลไม่สำเร็จ'); }catch(e){}
  }finally{
    if(!opts.light) QT_DB_FULL_TRIED=true;
    if(qtAccessToken()===token) Object.keys(QT_SYNC.dirty).forEach(k=>{ QT_DB_CACHE[k]=QT_SYNC.dirty[k]; }); /* keep local writes made during the load */
    QT_SYNC.dirty={}; QT_SYNC.busy=false; QT_DB_HYDRATING=false;
  }
  const now=qtAccessToken();
  if(!now){ qtResetCache(); QT_DB_HYDRATE_QUEUED=null; return; } /* logged out while loading */
  if(now!==token) QT_DB_HYDRATE_QUEUED={light:false}; /* another account signed in while loading: load again for it */
  else if(ok) qtRerenderAfterHydrate();
  const q=QT_DB_HYDRATE_QUEUED; QT_DB_HYDRATE_QUEUED=null;
  if(q) setTimeout(()=>qtBackgroundHydrate(q),0);
}
/* After the background load lands, refresh the page the person is looking at (never while they are typing). */
function qtRerenderAfterHydrate(tries){
  tries=tries||0;
  if(!currentUser()) return;
  const name=(location.hash.replace('#','')||'home').split('/')[0];
  if(name==='login'||name==='shop-register') return; /* these pages do not depend on loaded data */
  const a=document.activeElement;
  const typing=(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) ||
    [].slice.call(document.querySelectorAll('#app textarea, #app input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden])')).some(el=>String(el.value||'').trim());
  if(typing){ if(tries<6) setTimeout(()=>qtRerenderAfterHydrate(tries+1),1500); return; }
  const y=window.scrollY; try{ router(); }catch(e){ console.warn(e); } window.scrollTo(0,y);
}

    try{const ns=await qtSupabaseTable('notifications?select=*',{accessToken:token}); QT_DB_CACHE.qt_notifications=(Array.isArray(ns)?ns:[]).map(n=>({id:n.id,userId:n.user_id,title:n.title||'การแจ้งเตือน',message:n.message||'',body:n.message||'',link:qtNotifLinkFromRow(n),type:n.type||'system',referenceId:n.reference_id||null,read:n.is_read===true,readAt:n.is_read?new Date(n.created_at).getTime():null,createdAt:new Date(n.created_at).getTime()}));}catch(e){ if(!Array.isArray(QT_DB_CACHE.qt_notifications)) QT_DB_CACHE.qt_notifications=[]; }

function qtVibrate(pattern){
  try{if(typeof navigator.vibrate==='function')navigator.vibrate(pattern)}catch(e){}
}
function qtStartNotificationVibration(n){
  if(n&&!n.read&&!n.dismissed)qtVibrate(['new_order','order_update','support','approval'].includes(n.type)?[260,120,260]:[180]);
}
function qtStopNotificationVibration(){qtVibrate(0)}
function qtHandleNewNotification(n){
  const cur=currentUser();
  if(!cur || !n || n.userId!==cur.id) return;
  qtStartNotificationVibration(n);
  showLiveToast((n.title||'การแจ้งเตือน')+': '+(n.body||n.message||''), n.link);
}

function pushNotification(userId, title, body, link, type, referenceId){
  let all = dbGet('qt_notifications',[]);
  const now=Date.now();
  const safeLink=link||undefined;
  const inferred=qtNotifDbParts({link:safeLink,type,referenceId});
  /* Batch 5: prevent duplicate notifications caused by overlapping polling/monitors.
     The same user + title + body + link within a short window is one event. */
  const duplicate=all.find(n=>
    n.userId===userId &&
    String(n.title||'')===String(title||'') &&
    String(n.body||n.message||'')===String(body||'') &&
    String(n.link||'')===String(safeLink||'') &&
    now-Number(n.createdAt||0)<4000
  );
  if(duplicate){
    if(!duplicate.read) qtHandleNewNotification(duplicate);
    return duplicate;
  }
  const n={
    id:uid(),
    userId,
    title:title||'การแจ้งเตือน',
    body:body||'',
    link:safeLink,
    type:inferred.type,
    referenceId:referenceId || inferred.ref || null,
    read:false,
    createdAt:now
  };
  all.push(n);
  dbSet('qt_notifications', all);
  qtHandleNewNotification(n);
  return n;
}
function showLiveToast(text, link){
  const box = document.getElementById('notif-toast-box');
  if(!box) return;
  const el = document.createElement('div');
  el.className = 'notif-toast';
  el.textContent = '🔔 ' + text;
  if(link) el.onclick = ()=>navigate(link);
  box.appendChild(el);
  setTimeout(()=>el.remove(), 5000);
}
function markAllNotifRead(userId){
  let all = dbGet('qt_notifications',[]).map(n=> n.userId===userId ? {...n, read:true, readAt:n.readAt||Date.now()} : n);
  all.filter(n=>n.userId===userId).forEach(n=>qtStopNotificationVibration(n.id));
  dbSet('qt_notifications', all);
}

function tileLayer(map){
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'© OpenStreetMap contributors'
  }).addTo(map);
}
function initLocationPicker(containerId, lat, lng, onChange){
  lat = lat || 13.7563; lng = lng || 100.5018;
  const map = L.map(containerId).setView([lat,lng], 15);
  tileLayer(map);
  const marker = L.marker([lat,lng], {draggable:true}).addTo(map);
  marker.on('dragend', ()=>{ const p=marker.getLatLng(); onChange(p.lat,p.lng); });
  map.on('click', (e)=>{ marker.setLatLng(e.latlng); onChange(e.latlng.lat,e.latlng.lng); });
  onChange(lat,lng);
  registerMap(map);
  return {
    map, marker,
    locate(){
      if(!navigator.geolocation){ toast('เบราว์เซอร์ไม่รองรับ GPS'); return; }
      navigator.geolocation.getCurrentPosition(pos=>{
        const {latitude, longitude} = pos.coords;
        map.setView([latitude,longitude], 16);
        marker.setLatLng([latitude,longitude]);
        onChange(latitude,longitude);
        toast('ใช้ตำแหน่ง GPS ปัจจุบันแล้ว');
      }, err=> toast('ไม่สามารถขอตำแหน่ง GPS ได้: '+err.message));
    }
  };
}

function qtAudit(action, data={}){
  const u=currentUser();
  const logs=dbGet('qt_audit_log',[]);
  const d=(data&&typeof data==='object')?data:{};
  /* V5.53: audit_logs.entity_type is NOT NULL in Supabase. Many callers only
     supplied orderId/promotionId/etc., so infer a stable entity type/id before
     the row is persisted. */
  let entityType=d.entityType||d.entity_type||null;
  let entityId=d.entityId||d.entity_id||null;
  if(!entityType){
    const pairs=[
      ['orderId','order'],['order_id','order'],
      ['promotionId','promotion'],['promotion_id','promotion'],
      ['shopId','shop'],['shop_id','shop'],
      ['userId','user'],['user_id','user'],
      ['riderId','rider'],['rider_id','rider'],
      ['technicianId','technician'],['technician_id','technician'],
      ['productId','product'],['product_id','product'],
      ['customerId','customer'],['customer_id','customer']
    ];
    for(const [k,t] of pairs){
      if(d[k]!==undefined && d[k]!==null && String(d[k]).trim()!==''){ entityType=t; entityId=d[k]; break; }
    }
  }
  if(!entityType) entityType='system';
  if(!entityId || !qtUuidLike(entityId)) entityId=null;
  logs.push({id:uid(), action, actorId:u?.id||null, actorRole:u?.type||null, entityType, entityId, at:Date.now(), ...d});
  dbSet('qt_audit_log',logs);
}

function qtSyncHash(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return h; }
function qtSyncSignature(){
  const me=currentUser();
  const main=qtSyncHash(JSON.stringify([me&&me.status,dbGet('qt_orders',[]),dbGet([]),dbGet('qt_notifications',[])]));
  const chat=qtSyncHash(JSON.stringify(Object.keys(QT_DB_CACHE).filter(k=>k.startsWith('qt_order_chat_')&&!k.endsWith('_deleteAt')).sort().map(k=>[k,(QT_DB_CACHE[k]||[]).length])));
  return {main,chat};
}
function qtSyncRerender(before,after){
  const user=currentUser(); if(!user) return;
  const parts=(location.hash.replace('#','')||'home').split('/'); const name=parts[0], param=parts[1];
  if(name==='approval-pending' && isApproved(user)){ toast('บัญชีของคุณได้รับการอนุมัติแล้ว'); navigate('dashboard'); return; }
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; /* never interrupt typing */
  if(before.main===after.main) return;
  const safe=['dashboard','shop-orders','shop-order','shop-products','notifications','shop-settlement'];
  if(!safe.includes(name)) return;
  const typed=[].slice.call(document.querySelectorAll('#app textarea, #app input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden])')).some(el=>String(el.value||'').trim());
  if(typed) return;
  const y=window.scrollY; try{ router(); }catch(e){ console.warn(e); } window.scrollTo(0,y);
}
async function qtSyncTick(force){
  if(QT_SYNC.busy || QT_DB_HYDRATING) return;
  if(document.hidden && !force) return;
  if(!qtAccessToken()) return;
  if(QT_SYNC.pending>0 || Date.now()-QT_SYNC.lastWrite<2500) return; /* let our own writes land first */
  QT_SYNC.busy=true; QT_SYNC.dirty={};
  try{
    QT_SYNC.tick++;
    const me=currentUser();
    const full=(QT_SYNC.tick%8===0)||(me&&!isApproved(me))||!QT_DB_FULL_TRIED; /* light poll every 8s, full refresh about once a minute */
    const before=qtSyncSignature();
    const seenNotifs=new Set(dbGet('qt_notifications',[]).map(n=>n.id));
    await qtHydrateDatabase({light:!full});
    if(!qtAccessToken()){ qtResetCache(); return; } /* logged out while fetching */
    Object.keys(QT_SYNC.dirty).forEach(k=>{ QT_DB_CACHE[k]=QT_SYNC.dirty[k]; });
    if(me){ dbGet('qt_notifications',[]).forEach(n=>{ if(n.userId===me.id && !n.read && !seenNotifs.has(n.id)){ try{ qtHandleNewNotification(n); }catch(e){} } }); }
    const after=qtSyncSignature();
    if(after.main!==before.main||after.chat!==before.chat) qtSyncRerender(before,after);
  }catch(e){ console.warn('sync tick failed',e); }
  finally{ QT_SYNC.dirty={}; QT_SYNC.busy=false; }
}
function qtStartSyncLoop(){
  if(QT_SYNC.timer) return;
  QT_SYNC.timer=setInterval(()=>qtSyncTick(),8000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) qtSyncTick(); });
}
window.addEventListener('DOMContentLoaded', async ()=>{
  /* V5.33: show the page first, load Supabase data in the background */
  const hadSession=!!qtAccessToken();
  if(hadSession) await qtRestoreOwnUser(); /* one small request (own account row) so a refresh keeps the signed-in user */
  router();

      await qtSupabaseTable('shop_profiles?on_conflict=user_id',{method:'POST',accessToken:token,body:{user_id:users[idx].id,...profileBody}});
    }

    /* Verify the coordinates actually landed in the database before saying success. */

      throw new Error('พิกัดร้านในฐานข้อมูลไม่ตรงกับพิกัดที่บันทึก');

/* ---------- QT Order Number ---------- */
/* Order number display: QT-001, QT-002, ... (3 digits).
   Numbering is GLOBAL across all shops and resets each calendar day.
   Therefore no two shops can receive the same QT number on the same day.
   The internal id remains unchanged for routing/storage compatibility. */
function qtLocalDateKey(ts){
  const d = new Date(ts || Date.now());
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function displayOrderNumber(order){
  const raw = String(order?.orderNumber || order?.order_number || '').trim();
  /* รูปแบบใหม่ QT-YYYYMMDD-xxxx (ฝังวันที่เพื่อความ unique ในฐานข้อมูล) -> แสดงเฉพาะ QT-xxxx */
  const dated = raw.match(/^QT-\d{8}-(\d{3,4})$/i);
  if(dated) return 'QT-'+dated[1];
  if(raw) return raw; /* เลขออเดอร์รูปแบบเดิม (เช่น QT-001) ยังแสดงตามเดิมเพื่อความเข้ากันได้กับข้อมูลเก่า */
  const idx=dbGet('qt_orders',[]).findIndex(o=>o.id===order?.id);
  return 'QT-'+String(idx<0?1:idx+1).padStart(3,'0');
}

        <button class="btn-secondary" onclick="cycleModule('${m.key}')">${buttonLabel}</button>
      </div>`;
    }).join('');
  }catch(err){
    console.error('shop_modules load failed',err);
    const list=document.getElementById('qt-shop-modules-list');
    if(list)list.innerHTML=`<div class="qt-shop-empty">โหลดข้อมูลโมดูลไม่สำเร็จ: ${escapeHtml(err.message||err)}</div>`;
  }
}
async function cycleModule(moduleKey){
  const user=currentUser();
  if(!user||user.type!=='shop'){toast('ไม่มีสิทธิ์');return;}
  if(!QT_SHOP_MODULE_CATALOG.some(x=>x.key===moduleKey)){toast('ไม่พบโมดูล');return;}
  try{
    const rows=await qtLoadShopModules(user.id);
    const existing=rows.find(x=>x.module_key===moduleKey);
    const current=existing?.status||'disabled';
    const next=QT_SHOP_MODULE_STATUSES[(QT_SHOP_MODULE_STATUSES.indexOf(current)+1)%QT_SHOP_MODULE_STATUSES.length];
    const now=new Date().toISOString();
    const body={status:next,updated_at:now};
    if(!existing){
      body.shop_user_id=user.id;
      body.module_key=moduleKey;
      body.started_at=next==='disabled'?null:now;
      body.expires_at=null;
      await qtSupabaseTable('shop_modules?on_conflict=shop_user_id,module_key',{
        method:'POST',accessToken:await qtGetAccessToken(),body
      });
    }else{
      if(next!=='disabled'&&!existing.started_at)body.started_at=now;
      if(next==='disabled')body.expires_at=null;
      await qtSupabaseTable('shop_modules?id=eq.'+encodeURIComponent(existing.id),{
        method:'PATCH',accessToken:await qtGetAccessToken(),body
      });
    }
    toast(`โมดูล "${qtShopModuleLabel(moduleKey)}" → ${qtShopModuleStatusLabel(next)}`);
    await renderShopModules();
  }catch(err){
    console.error('shop_modules save failed',err);
    toast('บันทึกโมดูลไม่สำเร็จ: '+String(err.message||err).slice(0,120));
  }
}

<script>
/* =====================================================================
   V5.31 ADDITIONS — appended only, nothing above this block was removed.
   Covers: delivery-fee formula, GP 10% formula, Slide-to-Confirm engine,
   daily settlement + GP payment status screens (shop + admin).
   ===================================================================== */

/* ---------- 12. ค่าจัดส่งตามระยะทางจริง (GPS-based, ห้ามให้ผู้ใช้กรอกระยะทางเอง) ---------- */


/* ---------- 13/14. GP 10% + สูตรตั้งราคาขาย ---------- */
const QT_GP_RATE = 0.10; // ควบคุมจากระบบ/Admin เท่านั้น ร้านค้าแก้เองไม่ได้
function gpAmount(saleAmount){ return Math.round(saleAmount*QT_GP_RATE*100)/100; }



/* ---------- 16/17/18. สรุปยอดขายรายวัน + สถานะชำระ GP ---------- */
// สถานะการชำระ GP ใช้ค่าที่มีอยู่จริงในตาราง settlements: pending -> processing -> completed/cancelled
const GP_SETTLEMENT_STATUSES = {pending:'รอชำระ',processing:'รอตรวจสอบ',completed:'ชำระแล้ว',cancelled:'ยกเลิก'};
function qtOrderBelongsToShop(o, shopUserId, shopProfileId){
  return String(o.shopId)===String(shopUserId) || (!!shopProfileId && String(o.shopProfileId)===String(shopProfileId));
}
function computeDailySettlement(shopId, dateKey){
  const u=currentUser(), pid=u&&u.type==='shop' ? (u.shopProfileId || QT_SYNC.profileMaps?.shopByUserId?.get(u.id) || null) : null;
  const orders = dbGet('qt_orders',[]).filter(o=>qtOrderBelongsToShop(o,shopId,pid) && (o.orderDate||qtLocalDateKey(o.createdAt))===dateKey);
  let grossSales=0, cancelledTotal=0, gp=0;
  orders.forEach(o=>{
    const sub = (typeof o.subtotal==='number') ? o.subtotal : o.total; // orders created before V5.31 have no subtotal field
    if(o.status==='cancelled'){ cancelledTotal += sub; return; } // ยกเลิก -> ไม่คิด GP
    grossSales += sub;
    gp += (typeof o.gpAmount==='number') ? o.gpAmount : gpAmount(sub);
  });
  const netSales = grossSales; // ยอดขายสุทธิ = ยอดขายที่ไม่ถูกยกเลิก (คืนเงินบางส่วนยังไม่รองรับข้อมูลในต้นฉบับ V5.30)
  return { dateKey, grossSales: grossSales+cancelledTotal, cancelledTotal, netSales, gp, amountDue: gp };
}
function qtCurrentShopProfileId(user){
  return user && (user.shopProfileId || QT_SYNC.profileMaps?.shopByUserId?.get(user.id) || null);
}
function getSettlementRecord(shopUserId, dateKey){
  const u=currentUser(), pid=qtCurrentShopProfileId(u), all=dbGet('qt_settlements',[]);
  return all.find(s=>(String(s.shopId)===String(shopUserId)||String(s.shopId)===String(pid)) && s.dateKey===dateKey) || null;
}
function ensureSettlementRecord(shopUserId, dateKey){
  const u=currentUser(), pid=qtCurrentShopProfileId(u);
  if(!pid) throw new Error('ไม่พบรหัสโปรไฟล์ร้านในฐานข้อมูล');
  let all=dbGet('qt_settlements',[]);
  let rec=all.find(s=>String(s.shopId)===String(pid) && s.dateKey===dateKey);
  if(!rec){
    const v=computeDailySettlement(shopUserId,dateKey);
    rec={id:uid(),shopId:pid,dateKey,status:'pending',amount:Number(v.gp||0),createdAt:Date.now()};
    all.push(rec); dbSet('qt_settlements',all);
  }
  return rec;
}
function shopReportGpPayment(dateKey){
  const user=currentUser(); if(!user||user.type!=='shop'){toast('ไม่มีสิทธิ์');return;}
  let all=dbGet('qt_settlements',[]), pid=qtCurrentShopProfileId(user);
  if(!pid){toast('ไม่พบโปรไฟล์ร้านในฐานข้อมูล');return;}
  let rec=all.find(s=>String(s.shopId)===String(pid)&&s.dateKey===dateKey);
  if(!rec){rec=ensureSettlementRecord(user.id,dateKey);all=dbGet('qt_settlements',[]);}
  const target=all.find(s=>String(s.shopId)===String(pid)&&s.dateKey===dateKey);
  if(!target){toast('ไม่พบรายการยอด GP');return;}
  if(target.status!=='pending'){toast('รายการนี้แจ้งโอนไปแล้ว');return;}
  target.status='processing';
  target.amount=Number(computeDailySettlement(user.id,dateKey).gp||0);
  target.reportedAt=Date.now();
  dbSet('qt_settlements',all);
  toast('แจ้งโอนแล้ว รอแอดมินตรวจสอบ');
  renderShopSettlement();
}

let qtSalesRange=1;
function qtSetSalesRange(days){ qtSalesRange=days; renderShopSettlement(); }
function renderShopSettlement(){
  const user=currentUser(); if(!user||user.type!=='shop'){navigate('login');return;}
  const today=qtLocalDateKey(), start=new Date();start.setHours(12,0,0,0);start.setDate(start.getDate()-(qtSalesRange-1));
  const startKey=qtLocalDateKey(start.getTime());
  const pid=qtCurrentShopProfileId(user);
  const orders=dbGet('qt_orders',[]).filter(o=>qtOrderBelongsToShop(o,user.id,pid) && (o.orderDate||qtLocalDateKey(o.createdAt))>=startKey && (o.orderDate||qtLocalDateKey(o.createdAt))<=today);
  const active=orders.filter(o=>o.status!=='cancelled');
  const sales=active.reduce((n,o)=>n+Number(o.subtotal??o.total??0),0);
  const customers=new Set(active.map(o=>o.customerId).filter(Boolean)).size;
  const allShopOrders=dbGet('qt_orders',[]).filter(o=>qtOrderBelongsToShop(o,user.id,pid)&&o.status!=='cancelled');
  const newCustomers=[...new Set(active.map(o=>o.customerId).filter(Boolean))].filter(id=>!allShopOrders.some(o=>o.customerId===id&&(o.orderDate||qtLocalDateKey(o.createdAt))<startKey)).length;
  const prevStart=new Date(start);prevStart.setDate(prevStart.getDate()-qtSalesRange);const prevEnd=new Date(start);prevEnd.setDate(prevEnd.getDate()-1);
  const prevStartKey=qtLocalDateKey(prevStart.getTime()),prevEndKey=qtLocalDateKey(prevEnd.getTime());
  const prevSales=allShopOrders.filter(o=>{const d=o.orderDate||qtLocalDateKey(o.createdAt);return d>=prevStartKey&&d<=prevEndKey}).reduce((n,o)=>n+Number(o.subtotal??o.total??0),0);
  const change=prevSales?Math.round((sales-prevSales)/prevSales*100):null;
  const counts=Object.create(null), amounts=Object.create(null);
  active.forEach(o=>{const d=o.orderDate||qtLocalDateKey(o.createdAt);counts[d]=(counts[d]||0)+1;amounts[d]=(amounts[d]||0)+Number(o.subtotal??o.total??0)});
  const keys=[];for(let i=qtSalesRange-1;i>=0;i--){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);keys.push(qtLocalDateKey(d.getTime()))}
  const daily=keys.slice().reverse(), name=d=>new Date(d+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
  qtShopLayout('สรุปยอดขาย',`<div class="qt-shop-page-title"><h2>สรุปยอดขาย</h2></div>
    <div class="qt-ref-tabs">${[[1,'วันนี้'],[7,'7 วัน'],[30,'30 วัน']].map(([n,t])=>`<button class="${qtSalesRange===n?'active':''}" onclick="qtSetSalesRange(${n})">${t}</button>`).join('')}</div>
    <section class="qt-ref-section qt-ref-sales-summary"><small>ยอดขายรวม</small><h1>฿${sales.toLocaleString('th-TH',{maximumFractionDigits:2})}</h1>${change!==null?`<small class="qt-sales-change">${change>=0?'+':''}${change}% จากช่วงก่อนหน้า</small>`:''}<div class="qt-ref-sales-metrics"><div>จำนวนออเดอร์<b>${active.length}</b></div><div>ลูกค้าใหม่<b>${newCustomers}</b></div></div></section>
    <section class="qt-ref-section"><h3>รายละเอียด${qtSalesRange===1?'วันนี้':qtSalesRange+' วัน'}</h3>${daily.map(d=>`<div class="qt-ref-sales-day"><span>${name(d)}</span><div><b>฿${Number(amounts[d]||0).toLocaleString('th-TH',{maximumFractionDigits:2})}</b><small>${counts[d]||0} ออเดอร์</small></div></div>`).join('')}</section>
    <p class="qt-ref-sales-note">ยอดขายค่าสินค้าไม่รวมออร์เดอร์ที่ยกเลิก • รายการ GP และการชำระเงินดูได้ด้านล่าง</p>
    <section class="qt-ref-section"><h3>สรุป GP รายวัน</h3>${daily.filter(d=>amounts[d]).map(d=>{const rec=getSettlementRecord(user.id,d),v=computeDailySettlement(user.id,d),st=rec?.status||'pending';return `<div class="qt-ref-sales-day"><span>${name(d)}<small>GP ฿${v.gp.toLocaleString('th-TH',{maximumFractionDigits:2})} · ${GP_SETTLEMENT_STATUSES[st]||st}</small></span>${st==='pending'&&v.gp>0?`<button class="qt-shop-btn qt-shop-btn-soft" onclick="shopReportGpPayment('${d}')">แจ้งโอน</button>`:''}</div>`}).join('')||'<p>ไม่มีรายการ GP ในช่วงนี้</p>'}</section>`,'settlement');
}

</script>
<script id="qt-real-time-v1">
/* QueueTech Real-time v1
   - Uses Supabase Realtime (WebSocket) instead of page refresh/polling.
   - Rehydrates only after database events; the page itself is never refreshed.
   - If Realtime is unavailable, the existing background sync remains as fallback.
   - FIX: previously this called qtHydrateDatabase() directly, with no coordination
     with the 8s poll loop (qtSyncTick) or qtBackgroundHydrate. Since any change to
     any of 16 tables (including notifications, which are created on almost every
     status update by anyone) fired this immediately, it could run a second full
     hydrate WHILE the poll loop's hydrate was still in flight, racing writes into
     QT_DB_CACHE, and it always force-re-rendered the page even when nothing the
     viewer cared about had changed — this is what looked like the page "loading
     back and forth". It now shares QT_SYNC's busy flag with the poll loop (so only
     one hydrate ever runs at a time), debounces bursts of events into one hydrate,
     and only re-renders when the signature actually changed, same as qtSyncTick.
*/
(function(){
  let client=null, channel=null, retry=0, debounceTimer=null, pendingReason=null;
  const TABLES=['users','shop_profiles','products','orders','order_items','deliveries','payments','notifications','order_chat_messages','promotions','settlements'];

  function scheduleRefresh(reason){
    pendingReason=reason;
    if(debounceTimer) return; /* a refresh is already queued for the current burst of events */
    debounceTimer=setTimeout(()=>{ debounceTimer=null; refreshFromRealtime(pendingReason); },600);
  }

  async function refreshFromRealtime(reason){
    if(QT_SYNC.busy || QT_DB_HYDRATING){ scheduleRefresh(reason); return; } /* poll loop or another hydrate is mid-flight: don't run a second one, try again shortly */
    QT_SYNC.busy=true; QT_SYNC.dirty={};
    try{
      const before=qtSyncSignature();
      if(typeof qtHydrateDatabase==='function') await qtHydrateDatabase({light:false});
      Object.keys(QT_SYNC.dirty).forEach(k=>{ QT_DB_CACHE[k]=QT_SYNC.dirty[k]; });
      const after=qtSyncSignature();
      if(typeof qtSyncRerender==='function') qtSyncRerender(before,after); /* only re-renders the page if data actually changed */
      window.dispatchEvent(new CustomEvent('qt:realtime-update',{detail:{reason}}));
    }catch(e){ console.warn('[QueueTech Realtime] hydrate failed:',e); }
    finally{ QT_SYNC.dirty={}; QT_SYNC.busy=false; }
  }

  function subscribe(){
    if(!client) return;
    if(channel){ try{client.removeChannel(channel);}catch(e){} }
    channel=client.channel('qt-live-data-v1');
    TABLES.forEach(table=>{
      channel.on('postgres_changes',{event:'*',schema:'public',table},payload=>{
        scheduleRefresh(table+':'+payload.eventType);
      });
    });
    channel.subscribe(status=>{
      window.QT_REALTIME_STATUS=status;
      document.documentElement.dataset.qtRealtime=String(status||'').toLowerCase();
      if(status==='SUBSCRIBED'){
        retry=0;
        window.dispatchEvent(new CustomEvent('qt:realtime-status',{detail:{status:'SUBSCRIBED'}}));
      }else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
        window.dispatchEvent(new CustomEvent('qt:realtime-status',{detail:{status}}));
        retry=Math.min(retry+1,6);
        setTimeout(()=>{ try{subscribe();}catch(e){} }, Math.min(30000,1000*Math.pow(2,retry)));
      }
    });
  }

  function loadClient(){
    if(window.supabase?.createClient){
      try{ client=window.supabase.createClient(QT_SUPABASE_CONFIG.URL,QT_SUPABASE_CONFIG.KEY,{realtime:{params:{eventsPerSecond:20}}}); subscribe(); return; }catch(e){console.warn('[QueueTech Realtime] init failed',e);}
    }
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    sc.async=true;
    sc.onload=()=>{
      try{
        client=window.supabase.createClient(QT_SUPABASE_CONFIG.URL,QT_SUPABASE_CONFIG.KEY,{realtime:{params:{eventsPerSecond:20}}});
        subscribe();
      }catch(e){console.warn('[QueueTech Realtime] client init failed',e);}
    };
    sc.onerror=()=>console.warn('[QueueTech Realtime] CDN unavailable; fallback sync remains active');
    document.head.appendChild(sc);
  }

  window.addEventListener('online',()=>{ if(client) subscribe(); });
  window.addEventListener('hashchange',()=>{ if(client && window.QT_REALTIME_STATUS!=='SUBSCRIBED') subscribe(); });
  window.QT_REALTIME_FORCE_REFRESH=()=>refreshFromRealtime('manual');
  setTimeout(loadClient,800);
})();
</script>

<script id="qt-shop-new-order-realtime-v1">
(function(){
  const SEEN_KEY='qt_shop_seen_pending_orders_v1';
  const CHECK_MS=60000; // ตรวจหน้ารับออเดอร์ทุก 1 นาที
  let audioCtx=null;
  let soundTimer=null;
  let initialized=false;
  let checkBusy=false;

  function shopUserSafe(){
    try{
      const u=typeof shopUser==='function'?shopUser():null;
      if(u && u.type==='shop') return u;
    }catch(e){}
    try{
      const u=typeof currentUser==='function'?currentUser():null;
      if(u && u.type==='shop') return u;
    }catch(e){}
    return null;
  }

  function readSeen(){
    try{
      const x=JSON.parse(sessionStorage.getItem(SEEN_KEY)||'[]');
      return new Set(Array.isArray(x)?x.map(String):[]);
    }catch(e){ return new Set(); }
  }
  function saveSeen(set){
    try{
      const a=[...set].slice(-300);
      sessionStorage.setItem(SEEN_KEY,JSON.stringify(a));
    }catch(e){}
  }

  function unlockShopAudio(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        if(!audioCtx) audioCtx=new AC();
        if(audioCtx.state==='suspended') audioCtx.resume();
      }
    }catch(e){}
  }
  document.addEventListener('click',unlockShopAudio,{passive:true});
  document.addEventListener('touchend',unlockShopAudio,{passive:true});
  document.addEventListener('pointerup',unlockShopAudio,{passive:true});

  function beep(){
    try{
      unlockShopAudio();
      if(!audioCtx) return;
      const now=audioCtx.currentTime;
      [0,0.22,0.44].forEach((offset,i)=>{
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();
        osc.type='sine';
        osc.frequency.value=i===1?1046:880;
        gain.gain.setValueAtTime(0.0001,now+offset);
        gain.gain.exponentialRampToValueAtTime(0.28,now+offset+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.18);
        osc.connect(gain);gain.connect(audioCtx.destination);
        osc.start(now+offset);osc.stop(now+offset+0.2);
      });
    }catch(e){}
  }

  function speak(){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance('มีออเดอร์ใหม่เข้ามาค่ะ กรุณาตรวจสอบออเดอร์ใหม่');
      u.lang='th-TH';u.rate=.95;u.pitch=1;u.volume=1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function stopSound(){
    clearInterval(soundTimer);soundTimer=null;
    try{window.speechSynthesis.cancel();}catch(e){}
  }

  function showAlert(order){
    // Shop build V6: แจ้งออเดอร์ใหม่ด้วยเสียงเท่านั้น ไม่มี popup/ปุ่มบังคับกดรับทราบ
    stopSound();
    beep();
    speak();
    // อัปเดต badge/รายการออเดอร์จากข้อมูลเดิม โดยไม่เปลี่ยนฐานข้อมูลหรือสถานะออเดอร์
    try{ window.dispatchEvent(new CustomEvent('qt:shop-new-order-sound',{detail:{orderId:order.id}})); }catch(e){}
  }

  function pendingShopOrders(u){
    try{
      const all=typeof dbGet==='function'?dbGet('qt_orders',[]):[];
      return (Array.isArray(all)?all:[])
        .filter(o=>String(o.shopId)===String(u.id) && o.status==='pending_shop')
        .sort((a,b)=>(Number(a.createdAt)||0)-(Number(b.createdAt)||0));
    }catch(e){return [];}
  }

  async function refreshEveryMinute(){
    const u=shopUserSafe();
    if(!u || checkBusy) return;
    checkBusy=true;
    try{
      // ใช้ Supabase Realtime ที่มีอยู่ก่อน; ถ้าข้อมูลยังไม่เปลี่ยน
      // ให้ hydrate ใหม่ทุก 1 นาทีเป็น fallback/heartbeat ของหน้ารับออเดอร์
      if(typeof window.QT_REALTIME_FORCE_REFRESH==='function'){
        await window.QT_REALTIME_FORCE_REFRESH();
      }else if(typeof window.qtBackgroundHydrate==='function'){
        await window.qtBackgroundHydrate({light:false});
      }else if(typeof window.qtHydrateDatabase==='function'){
        await window.qtHydrateDatabase({light:false});
      }
      checkForNewOrders();
    }catch(e){
      console.warn('[QueueTech Shop Order Monitor]',e);
    }finally{
      checkBusy=false;
    }
  }

  function checkForNewOrders(){
    const u=shopUserSafe();
    if(!u) return;
    const orders=pendingShopOrders(u);
    const seen=readSeen();

    // ครั้งแรก: จำออเดอร์ที่มีอยู่แล้ว ไม่ยิงเสียงย้อนหลัง
    if(!initialized){
      orders.forEach(o=>seen.add(String(o.id)));
      saveSeen(seen);
      initialized=true;
      return;
    }

    for(const order of orders){
      if(!seen.has(String(order.id))){
        seen.add(String(order.id));
        saveSeen(seen);
        showAlert(order);
        break;
      }
    }
  }

  function boot(){
    setTimeout(()=>{
      checkForNewOrders();
      // หน้ารับออเดอร์ตรวจสอบ/ซิงก์ทุก 1 นาที
      setInterval(refreshEveryMinute,CHECK_MS);
    },1200);
  }

  window.addEventListener('qt:realtime-update',()=>{
    // Supabase Realtime เข้ามาก่อน 1 นาทีได้ทันที
    checkForNewOrders();
  });
  window.addEventListener('hashchange',()=>{
    setTimeout(checkForNewOrders,250);
  });
  window.addEventListener('storage',ev=>{
    if(ev.key==='qt_orders') setTimeout(checkForNewOrders,50);
  });

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>

<script id="qt-active-product-save-v15">
window.handleSaveProduct=async function(e,id){
  e.preventDefault();
  const user=currentUser();
  if(!user||user.type!=='shop'){toast('เฉพาะร้านค้าเท่านั้น');return false;}
  const products=dbGet('qt_products',[]);
  const profileId=user.shopProfileId||QT_SYNC.profileMaps?.shopByUserId?.get(user.id);
  const old=id?products.find(p=>String(p.id)===String(id)&&(String(p.shopId)===String(user.id)||(profileId&&String(p.shopProfileId)===String(profileId)))):null;
  if(id&&!old){toast('ไม่พบสินค้าของร้าน');return false;}
  const name=document.getElementById('p-name')?.value.trim()||'';
  const price=Number(document.getElementById('p-price')?.value);
  if(!name||!Number.isFinite(price)||price<=0){toast('กรุณากรอกชื่อสินค้าและราคาที่ถูกต้อง');return false;}
  const button=e.submitter;if(button)button.disabled=true;
  try{
    const file=document.getElementById('p-image')?.files?.[0];
    const image=file?await readFileAsDataURL(file):(old?.image||'');
    const fee=gpAmount(price);
    const data={name,price,netPrice:Math.round((price-fee)*100)/100,
      gpRate:QT_GP_RATE,gpAmount:fee,
      category:document.getElementById('p-category')?.value.trim()||'อาหารจานเดียว',
      description:document.getElementById('p-desc')?.value.trim()||'',
      available:!!document.getElementById('p-available')?.checked,
      options:old?.options||[],image};
    if(old)Object.assign(old,data);
    else products.push({id:uid(),shopId:user.id,shopProfileId:profileId||undefined,...data});
    dbSet('qt_products',products);
    toast('บันทึกสินค้าสำเร็จ');renderShopProductsModern();
  }catch(err){console.error(err);toast('บันทึกสินค้าไม่สำเร็จ');}
  finally{if(button)button.disabled=false;}
  return false;
};
</script>
<script id="qt-shop-only-route-firewall">
(function(){
  const SHOP_ROUTES = new Set([
    'login','shop-register','dashboard','shop-setup','shop-products','shop-orders','shop-order',
    'shop-profile','shop-promote','shop-modules','shop-settlement','shop-support','admin-support','notifications'
  ]);
  function rootOf(hash){
    const raw=String(hash||location.hash||'#login').replace(/^#/,'');
    return (raw.split('/')[0]||'login').trim();
  }
  function enforceShopRoute(){
    const root=rootOf();
    if(!SHOP_ROUTES.has(root)){
      const u=(typeof currentUser==='function')?currentUser():null;
      location.hash=(u&&u.type==='shop')?'#dashboard':'#login';
      return false;
    }
    return true;
  }
  window.addEventListener('hashchange',enforceShopRoute,true);
  window.addEventListener('DOMContentLoaded',enforceShopRoute,{once:true});
  setTimeout(enforceShopRoute,0);
})();
</script>

<script id="qt-shop-support-v12">
let qtSupportSelectedShop=null,qtSupportLoading=false;
function qtSupportTime(value){return new Date(value).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function qtSupportBubble(message,me){
  return `<div class="qt-support-bubble ${message.sender_user_id===me?'mine':'theirs'}"><div>${escapeHtml(message.body)}</div><small>${message.sender_user_id===me?'คุณ':'คู่สนทนา'} · ${qtSupportTime(message.created_at)}</small></div>`;
}
function renderShopSupport(){
  const u=currentUser();if(!u||u.type!=='shop'){navigate('login');return}
  qtShopLayout('ติดต่อแอดมิน',`<div class="qt-shop-page-title"><button class="qt-shop-back" onclick="navigate('shop-profile')">←</button><h2>ติดต่อแอดมิน</h2><button class="qt-support-refresh" onclick="qtSupportRefresh()">↻</button></div>
    <p class="qt-support-hint">ส่งคำถามหรือแจ้งปัญหาให้ทีมแอดมิน ข้อความและคำตอบจะอยู่ในหน้านี้</p>
    <section class="qt-support-panel"><div class="qt-support-top"><span>✉</span><div><b>ข้อความถึงแอดมิน</b><small>QueueTech Support</small></div></div><div id="qt-support-messages" class="qt-support-messages"><p>กำลังโหลดข้อความ...</p></div>
      <form class="qt-support-compose" onsubmit="return qtSupportSend(event)"><textarea id="qt-support-input" rows="2" maxlength="2000" required placeholder="พิมพ์ข้อความถึงแอดมิน..."></textarea><button type="submit">ส่งข้อความ</button></form></section>`,'profile');

  qtSupportRefresh();
}
function renderAdminSupport(){
  const u=currentUser();if(!u||u.type!=='admin'){navigate('login');return}
  document.querySelectorAll('body > .qt-shop-bottom').forEach(nav=>nav.remove());
  document.body.className='qt-shop-app qt-admin-support-page';
  document.title='ข้อความร้านค้า - QueueTech';
  document.getElementById('app').innerHTML=`<header class="qt-header"><div class="qt-shop-brand"><div class="qt-shop-brand-mark">⌂</div><div class="qt-shop-brand-name">QueueTech <small>แอดมิน</small></div></div><button class="qt-shop-icon-btn" onclick="logout()">ออก</button></header><main class="qt-main"><div class="qt-shop-page-title"><h2>ข้อความจากร้านค้า</h2><button class="qt-support-refresh" onclick="qtSupportRefresh()">↻</button></div><div id="qt-support-inbox" class="qt-support-inbox">กำลังโหลดข้อความ...</div><section class="qt-support-panel"><div id="qt-support-admin-title" class="qt-support-top">เลือกร้านค้าเพื่อดูข้อความ</div><div id="qt-support-messages" class="qt-support-messages"></div><form id="qt-support-admin-form" class="qt-support-compose" onsubmit="return qtSupportSend(event)" hidden><textarea id="qt-support-input" rows="2" maxlength="2000" required placeholder="พิมพ์คำตอบถึงร้านค้า..."></textarea><button type="submit">ตอบกลับ</button></form></section></main>`;
  qtSupportRefresh();
}
window.qtSupportSelectShop=function(id){qtSupportSelectedShop=id;qtSupportRefresh()};
window.qtSupportRefresh=async function(){
  if(qtSupportLoading)return;
  const u=currentUser(),box=document.getElementById('qt-support-messages');if(!u||!box)return;
  qtSupportLoading=true;
  try{
    const token=await qtGetAccessToken();if(!token)throw new Error('กรุณาเข้าสู่ระบบอีกครั้ง');
    let rows=await qtSupabaseTable('shop_support_messages?select=id,shop_user_id,sender_user_id,body,created_at'+(u.type==='shop'?'&shop_user_id=eq.'+encodeURIComponent(u.id):'')+'&order=created_at.asc',{accessToken:token});
    rows=Array.isArray(rows)?rows:[];
    if(u.type==='admin'){
      const ids=[...new Set(rows.map(m=>m.shop_user_id))],profiles=ids.length?await qtSupabaseTable('shop_profiles?select=user_id,shop_name&user_id=in.('+ids.map(encodeURIComponent).join(',')+')',{accessToken:token}):[];
      const names=new Map((profiles||[]).map(p=>[p.user_id,p.shop_name]));
      if(!qtSupportSelectedShop&&ids.length)qtSupportSelectedShop=ids[0];
      const inbox=document.getElementById('qt-support-inbox');
      if(inbox)inbox.innerHTML=ids.length?ids.map(id=>`<button class="${qtSupportSelectedShop===id?'active':''}" onclick="qtSupportSelectShop('${id}')"><span>✉</span><b>${escapeHtml(names.get(id)||'ร้านค้า')}</b><small>${rows.filter(m=>m.shop_user_id===id).length} ข้อความ</small></button>`).join(''):'<div class="qt-shop-empty">ยังไม่มีข้อความจากร้านค้า</div>';
      const title=document.getElementById('qt-support-admin-title');
      if(title)title.textContent=qtSupportSelectedShop?'สนทนากับ '+(names.get(qtSupportSelectedShop)||'ร้านค้า'):'เลือกร้านค้าเพื่อดูข้อความ';
      const form=document.getElementById('qt-support-admin-form');if(form)form.hidden=!qtSupportSelectedShop;
      rows=rows.filter(m=>m.shop_user_id===qtSupportSelectedShop);
    }
    const wasNearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
    box.innerHTML=rows.length?rows.map(m=>qtSupportBubble(m,u.id)).join(''):'<div class="qt-support-empty">ยังไม่มีข้อความ เริ่มพิมพ์ข้อความด้านล่างได้เลย</div>';
    if(wasNearBottom)box.scrollTop=box.scrollHeight;
  }catch(e){box.innerHTML='<div class="qt-support-error">'+escapeHtml(e.message||'โหลดข้อความไม่สำเร็จ')+'</div>'}
  finally{qtSupportLoading=false}
};
window.qtSupportSend=function(e){
  e.preventDefault();
  (async()=>{
    const u=currentUser(),input=document.getElementById('qt-support-input'),button=e.target.querySelector('button[type=submit]'),body=input?.value.trim();
    const shopId=u?.type==='shop'?u.id:qtSupportSelectedShop;
    if(!u||!shopId||!body)return;
    button.disabled=true;
    try{
      const token=await qtGetAccessToken();if(!token)throw new Error('กรุณาเข้าสู่ระบบอีกครั้ง');
      await qtSupabaseTable('shop_support_messages',{method:'POST',accessToken:token,body:{shop_user_id:shopId,sender_user_id:u.id,body}});
      input.value='';await qtSupportRefresh();
    }catch(err){toast('ส่งข้อความไม่สำเร็จ: '+(err.message||'โปรดลองอีกครั้ง'))}
    finally{button.disabled=false}
  })();
  return false;
};
setInterval(()=>{if(['#shop-profile','#shop-support','#admin-support'].includes(location.hash))qtSupportRefresh()},20000);
</script>

function shopOrders(u){const pid=profileId(u);return dbGet('qt_orders',[]).filter(o=>String(o.shopId)===String(u.id)||(pid&&String(o.shopProfileId)===String(pid))).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}

window.qtShopForgotPassword=async function(){const email=prompt('กรอกอีเมลบัญชีร้านค้า');if(!email)return;try{await qtSupabaseAuth('recover',{email:email.trim()});toast('ส่งลิงก์ตั้งรหัสผ่านใหม่แล้ว')}catch(e){toast(e.message||'ส่งลิงก์ไม่สำเร็จ')}};

window.renderShopPromoteCreate=function(){layout('สร้างโปรโมชั่น',`<form class="qgm-card qgm-form-card" onsubmit="return qgmSavePromo(event)"><div class="qgm-field"><label>ชื่อ/ประเภทโปรโมชั่น</label><input id="qgm-promo-title" required placeholder="เช่น โปรโมตร้านประจำสัปดาห์"></div><div class="qgm-inline"><div class="qgm-field"><label>งบสูงสุด</label><input id="qgm-promo-budget" type="number" min="0" required></div><div class="qgm-field"><label>จำนวนวัน</label><input id="qgm-promo-days" type="number" min="1" value="7" required></div></div><button class="qgm-primary" type="submit">ส่งคำขอโปรโมชั่น</button></form>`,'shop-promote',{back:true})};
window.qgmSavePromo=async function(e){e.preventDefault();const u=shopUser(),pid=profileId(u);try{await qtSupabaseTable('promotions',{method:'POST',accessToken:qtAccessToken(),body:{shop_id:pid,shop_name:u.shopName||u.name,category:$('#qgm-promo-title').value.trim(),area:u.address||'',bid_price:0,max_budget:Number($('#qgm-promo-budget').value),period_days:Number($('#qgm-promo-days').value),status:'pending',payment_status:'pending',metadata:{title:$('#qgm-promo-title').value.trim()}}});toast('ส่งคำขอโปรโมชั่นแล้ว');navigate('shop-promote')}catch(err){toast('บันทึกโปรโมชั่นไม่สำเร็จ: '+(err.message||err))}return false};

window.renderShopProfileModern=function(){const u=shopUser();if(!u)return navigate('login');const cover=img(u.cover||u.coverImage||u.logo);layout('ข้อมูลร้านค้า',`<div class="qgm-profile-cover"><img src="${esc(cover)}"><button class="qgm-camera" onclick="navigate('shop-setup')">${svg('camera')}</button></div><div class="qgm-profile-name"><h2>${esc(u.shopName||u.name||'ร้านค้า')}</h2><span class="qgm-status done">● ออนไลน์</span></div><section class="qgm-card qgm-info"><div class="qgm-detail-row">${svg('box')}<span>${esc(categoryLabel(u.category)||'ร้านค้า')}</span></div><div class="qgm-detail-row">${svg('phone')}<span>${esc(u.phone||'-')}</span></div><div class="qgm-detail-row">${svg('pin')}<span>${esc(u.address||'-')}</span></div><div class="qgm-detail-row">${svg('clock')}<span>เปิดบริการ ${esc(u.openTime||'06:00')} - ${esc(u.closeTime||'22:00')} น.</span></div></section><button class="qgm-outline" onclick="navigate('shop-setup')">แก้ไขข้อมูลร้าน</button><button class="qgm-primary" onclick="navigate('shop-products')">จัดการเมนูสินค้า</button>`,'shop-profile',{back:true})};

function route(){const hash=location.hash.replace('#','')||'dashboard',[page,param]=hash.split('/'),u=currentUser();if(page==='login'||!u){if(page==='shop-register'&&typeof renderShopRegister==='function')return renderShopRegister();return renderShopLogin()}if(u.type==='admin'&&typeof renderAdminSupport==='function')return renderAdminSupport();if(u.type!=='shop'){clearSession();return renderShopLogin()}if(u.status!=='approved'&&!['shop-setup','approval-pending'].includes(page)&&typeof renderShopPending==='function')return renderShopPending();switch(page){case'home':case'dashboard':return renderShopDashboardModern(u);case'shop-orders':return renderShopOrdersModern();case'shop-order':return renderShopOrderModern(param);case'shop-products':return renderShopProductsModern();case'shop-catalog':return renderShopCatalog();case'shop-product':return renderShopProductEditor(param||'new');case'shop-promote':return renderShopPromote();case'shop-promote-create':return renderShopPromoteCreate();case'shop-profile':return renderShopProfileModern();case'shop-setup':return renderShopSetup();case'shop-settlement':return renderShopSettlement();case'shop-modules':return renderShopModules();case'notifications':return renderNotifications();default:return renderShopDashboardModern(u)}}
window.qtShopRoute=route;window.router=route;
})();
</script></body>
</html>
